<ion-content style="--background: var(--ion-color-light);">
  <!-- Header -->
  <div class="header" style="display: flex; align-items: center;">
    <img src="assets/imagens/Ambrosio.png" alt="Ambrosio" class="header-icon" style="height: 40px; margin-right: 12px;" />
    <h1 class="header-title">Ambrosio</h1>
    <ion-icon name="person-circle-outline" class="header-icon" (click)="goToTab5()"></ion-icon>
  </div>

  <!-- Welcome Message -->
  <div class="welcome-message">
    <h1>Bem-vindo ao Ambrósio!</h1>
    <p>A tua experiência começa aqui.</p>
  </div>

  <!-- Notification Icon -->
  <div class="notification-icon">
    <ion-icon 
      [name]="notificationsActive ? 'notifications' : 'notifications-outline'" 
      class="icon" 
      (click)="toggleNotifications()">
    </ion-icon>
  </div>

  <!-- Slideshow -->
  <div class="slideshow">
    <img [src]="images[currentImageIndex]" alt="Promoção" />
  </div>

  <!-- Menu -->
  <div class="menu-title">O teu Menu</div>
  <div class="menu-rectangles">
    <button class="menu-rectangle large" (click)="goToListas()">
      <ion-icon name="book-outline"></ion-icon>
      <span>Listas</span>
    </button>
    <div class="menu-rectangle-row">
      <button class="menu-rectangle" (click)="goToHistorico($event)">
        <ion-icon name="time-outline"></ion-icon>
        <span>Histórico</span>
      </button>
      <button class="menu-rectangle" (click)="goToEstatisticas()">
        <ion-icon name="stats-chart-outline"></ion-icon>
        <span>Estatísticas</span>
      </button>
    </div>
  </div>
</ion-content>
