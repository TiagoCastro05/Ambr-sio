<ion-content [fullscreen]="true">
  
  <!-- Profile Avatar Section -->
  <div class="profile-avatar-section">
    <div class="avatar-container">
      <ion-icon name="person-circle" class="avatar-icon"></ion-icon>
    </div>
    
    <!-- User Info Display -->
    <div class="user-info">
      <h2 class="username">{{ user.nome || '[Nome não definido]' }}</h2>
      <p class="user-email">{{ user.email || '[Email não definido]' }}</p>
      <!-- Debug info (remover depois) -->
      <small style="color: #999; font-size: 0.8rem;">
        Debug: {{ user | json }}
      </small>
    </div>
  </div>

  <!-- Settings Section -->
  <div class="settings-section">
    <ion-list>
      <ion-item button (click)="toggleColorOption()">
        <ion-icon name="settings-outline" slot="start"></ion-icon>
        <ion-label>
          <h3>Definições</h3>
          <p>Personalizar aparência</p>
        </ion-label>
        <ion-icon name="chevron-down-outline" slot="end" [class.expanded]="showColorOption"></ion-icon>
      </ion-item>
      
      <div class="color-option" [class.show]="showColorOption">
        <ion-item>
          <ion-label>
            <h4>Cor do Tema</h4>
          </ion-label>
          <input 
            type="color" 
            [value]="color" 
            (input)="changeColor($event)" 
            class="color-picker" 
            slot="end" />
        </ion-item>
      </div>
    </ion-list>
  </div>

  <!-- Logout Button -->
  <div class="logout-section">
    <ion-button 
      expand="block" 
      fill="outline" 
      color="danger" 
      (click)="logout()" 
      class="logout-button">
      <ion-icon name="log-out-outline" slot="start"></ion-icon>
      Terminar Sessão
    </ion-button>
  </div>

</ion-content>
