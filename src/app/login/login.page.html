<ion-content class="login-content">
  <div class="login-container">
    
    <!-- Logo Ambrosio -->
    <div class="logo-container">
      <img src="assets/imagens/Ambrosio.png" alt="Ambrosio Logo" class="logo">
    </div>
    
    <!-- Título da tela -->
    <div class="title-container">
      <h1 class="main-title">{{ isSignup ? 'Sign Up' : 'Login' }}</h1>
    </div>
    
    <!-- Formulário reativo para autenticação -->
    <form [formGroup]="authForm" (ngSubmit)="onSubmit()" class="auth-form">
      
      <!-- Campo de email (sempre visível) -->
      <div class="input-wrapper">
        <ion-input 
          type="email" 
          formControlName="email" 
          placeholder="Email"
          fill="outline"
          class="custom-input">
        </ion-input>
      </div>

      <!-- Campo de nome (apenas visível em modo de registo) -->
      <div class="input-wrapper" *ngIf="isSignup">
        <ion-input 
          type="text" 
          formControlName="nome" 
          placeholder="Nome"
          fill="outline"
          class="custom-input">
        </ion-input>
      </div>

      <!-- Campo de telefone (apenas visível em modo de registo) -->
      <div class="input-wrapper" *ngIf="isSignup">
        <ion-input 
          formControlName="telefone" 
          placeholder="Telefone"
          fill="outline"
          class="custom-input">
        </ion-input>
      </div>

      <!-- Campo de password (obrigatório) -->
      <div class="input-wrapper">
        <ion-input 
          formControlName="password" 
          type="password" 
          placeholder="Password"
          fill="outline"
          class="custom-input">
        </ion-input>
      </div>

      <!-- Botão para submeter o formulário -->
      <ion-button 
        expand="block" 
        type="submit" 
        [disabled]="authForm.invalid" 
        class="primary-button">
        {{ isSignup ? 'Sign Up' : 'Login' }}
      </ion-button>

      <!-- Separador "ou" -->
      <div class="divider">
        <span>ou</span>
      </div>

      <!-- Botão para alternar entre login e registo -->
      <ion-button 
        expand="block" 
        fill="outline" 
        (click)="toggleMode()"
        class="secondary-button">
        {{ isSignup ? 'Login' : 'Sign Up' }}
      </ion-button>
    </form>
    
  </div>
</ion-content>
